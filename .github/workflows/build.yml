name: Build Windows module
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: tools\build.cmd
      - name: Package
        run: python tools/package.py
      # Version tags become GitHub Releases with the packages attached. Release
      # assets do not use the Actions artifact storage quota (which is full).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EFLink-*.zip
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-dev') }}
          generate_release_notes: true
