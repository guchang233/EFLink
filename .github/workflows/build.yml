name: Build Windows module
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: tools\build.cmd
      - name: Package
        run: python tools/package.py
      # Packages are kept only for version tags and manual runs: uploading one
      # per push filled the account's artifact storage and failed every run.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: EFLink-Windows-x64
          path: dist/*
          retention-days: 14
