name: Build Windows module
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: tools\build.cmd
      - name: Package
        run: python tools/package.py
      - name: Select reviewed release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        shell: pwsh
        run: |
          $taskNotes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path -LiteralPath $taskNotes) {
            "path=$taskNotes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      # Version tags become GitHub Releases with the packages attached. Release
      # assets do not use the Actions artifact storage quota (which is full).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EFLink-*.zip
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-dev') }}
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: false
